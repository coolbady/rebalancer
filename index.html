<!DOCTYPE html>
<html lang="zh-HK">
<head>

<!-- PWA 全螢幕獨立 App 設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資產再平衡">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090d16">
<!-- 桌面 App 圖示 (餅圖圖標範例) -->
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/pie-chart.png">
<link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/pie-chart.png">




  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資產再平衡計算器</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #1a243b;
      --border: #263554;
      --text: #f1f5f9;
      --text-muted: #8e9fb5;
      --primary: #3b82f6;
      --purple: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    
    .api-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .api-row label { font-size: 0.82rem; color: var(--text-muted); }
    .api-row a { font-size: 0.8rem; color: var(--primary); text-decoration: none; }
    
    label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    input[type="number"], input[type="text"], input[type="password"] {
      width: 100%; background: #0b1120; border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-size: 16px; /* 16px 避免 iOS 縮放 */
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    
    .grid-cash { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-top: 4px; }
    
    /* 桌面版表格設定 */
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { color: var(--text-muted); font-weight: 500; padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    
    /* 響應式：手機版將表格轉為卡片 */
    @media (max-width: 768px) {
      .grid-cash { grid-template-columns: 1fr; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; } /* 隱藏擠壓的表頭 */
      
      tbody tr.asset-item {
        background: var(--card-inner);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      
      td { border-bottom: none; padding: 0; width: 100%; }
      
      .mobile-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mobile-top-bar .ticker-input {
        width: 130px;
        font-size: 1.1rem;
        font-weight: 700;
      }
      
      .mobile-input-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .field-group label { margin-bottom: 4px; font-size: 0.75rem; }
      
      .mobile-calc-summary {
        display: flex;
        justify-content: space-between;
        background: rgba(0,0,0,0.25);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      
      .mobile-action-cell { width: 100%; }
      .mobile-action-cell .badge {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        font-size: 0.9rem;
      }
    }
    
    /* 狀態標籤 */
    .badge { border-radius: 6px; font-weight: 600; text-align: center; }
    .badge-buy { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-sell { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-hold { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }
    
    /* 按鈕樣式 */
    .btn { cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; font-weight: 600; transition: opacity 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-secondary { background: #1a243b; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-del { background: transparent; color: var(--danger); font-size: 1.2rem; padding: 4px 8px; }
    
    .btn-toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-toolbar .btn { flex: 1 1 calc(50% - 4px); }
    @media (min-width: 640px) { .btn-toolbar .btn { flex: initial; } }
    
    .footer-summary { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; gap: 6px; }
    .weight-warn { color: var(--danger); font-weight: 600; }
    .weight-ok { color: var(--success); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <!-- API Key 與未投入資金 -->
  <div class="card">
    <div class="api-row">
      <div style="flex: 1; max-width: 320px;">
        <label for="apiKey">Finnhub API Key</label>
        <input type="password" id="apiKey" placeholder="貼上 API Key">
      </div>
      <a href="https://finnhub.io/register" target="_blank" rel="noopener">免費取得 Key ↗</a>
    </div>

    <div class="grid-cash">
      <div>
        <label for="newCash">未投入現金 ($ USD)</label>
        <input type="number" id="newCash" placeholder="0" min="0" step="100">
      </div>
      <div>
        <label>調整後總組合價值 (含新現金)</label>
        <div class="stat-val" id="totalPortfolioValue">$0.00</div>
      </div>
    </div>
  </div>

  <!-- 資產列表 -->
  <div class="card">
    <div class="table-container">
      <table id="assetTable">
        <thead>
          <tr>
            <th>標的代號</th>
            <th style="text-align: right;">持股數</th>
            <th style="text-align: right;">現價 ($)</th>
            <th style="text-align: right;">現有市值 ($)</th>
            <th style="text-align: right;">目標權重 (%)</th>
            <th style="text-align: right;">目標金額 ($)</th>
            <th style="text-align: center;">執行建議</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="assetBody"></tbody>
      </table>
    </div>

    <!-- 底部操作列 -->
    <div class="btn-toolbar">
      <button type="button" class="btn btn-primary" onclick="addAssetRow()">+ 新增標的</button>
      <button type="button" class="btn btn-purple" id="btnFetch" onclick="fetchLivePrices()">即時更新現價</button>
      <button type="button" class="btn btn-secondary" onclick="exportBackup()">下載備份 (.json)</button>
      <button type="button" class="btn btn-secondary" onclick="importBackup()">匯入備份</button>
    </div>

    <div class="footer-summary">
      <div id="weightValidation">目標權重合計: 0%</div>
      <div>現有持倉總額: <span id="currentHoldingsSum">$0.00</span></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'portfolio_rebalancer_mobile_v1';

const DEFAULT_PORTFOLIO = {
  apiKey: '',
  cash: 5000,
  assets: [
    { ticker: 'RSSF', shares: 500, price: 36.11, targetWeight: 25 },
    { ticker: 'VXUS', shares: 200, price: 85.85, targetWeight: 20 },
    { ticker: 'AVUV', shares: 130, price: 120.73, targetWeight: 20 },
    { ticker: 'SGOV', shares: 100, price: 100.45, targetWeight: 15 },
    { ticker: 'DBMF', shares: 0,   price: 33.15, targetWeight: 20 }
  ]
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_PORTFOLIO));
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function updateField(index, key, val) {
  if (!state.assets[index]) return;
  if (key === 'ticker') {
    state.assets[index].ticker = (val || '').toUpperCase();
  } else {
    state.assets[index][key] = parseFloat(val) || 0;
  }
  saveState();
  recalculateOnly();
}

function addAssetRow() {
  state.assets.push({ ticker: 'NEW', shares: 0, price: 0, targetWeight: 0 });
  saveState();
  render();
}

function removeAssetRow(index) {
  state.assets.splice(index, 1);
  saveState();
  render();
}

function recalculateOnly() {
  const newCash = parseFloat(state.cash) || 0;
  let currentSum = 0;
  let totalWeight = 0;

  state.assets.forEach(a => {
    const marketVal = (parseFloat(a.shares) || 0) * (parseFloat(a.price) || 0);
    currentSum += marketVal;
    totalWeight += (parseFloat(a.targetWeight) || 0);
  });

  const totalPortfolio = currentSum + newCash;
  document.getElementById('totalPortfolioValue').textContent = '$' + totalPortfolio.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('currentHoldingsSum').textContent = '$' + currentSum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const weightEl = document.getElementById('weightValidation');
  if (Math.abs(totalWeight - 100) < 0.01) {
    weightEl.innerHTML = `<span class="weight-ok">目標權重合計: ${totalWeight.toFixed(1)}% (平衡)</span>`;
  } else {
    weightEl.innerHTML = `<span class="weight-warn">目標權重合計: ${totalWeight.toFixed(1)}% (需調整至 100%)</span>`;
  }

  state.assets.forEach((a, i) => {
    const price = parseFloat(a.price) || 0;
    const currentVal = (parseFloat(a.shares) || 0) * price;
    const targetAmount = totalPortfolio * ((parseFloat(a.targetWeight) || 0) / 100);
    const deltaVal = targetAmount - currentVal;
    const deltaShares = price > 0 ? Math.round(deltaVal / price) : 0;

    const valEl = document.getElementById(`val-${i}`);
    const targetEl = document.getElementById(`target-${i}`);
    const actionEl = document.getElementById(`action-${i}`);

    if (valEl) valEl.textContent = '$' + currentVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (targetEl) targetEl.textContent = '$' + targetAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    if (actionEl) {
      if (Math.abs(deltaVal) < 1) {
        actionEl.innerHTML = `<div class="badge badge-hold"><span>持有</span><span>(符合目標)</span></div>`;
      } else if (deltaVal > 0) {
        actionEl.innerHTML = `<div class="badge badge-buy"><span>買入 +$${Math.round(deltaVal).toLocaleString()}</span><span>(+${deltaShares} 股)</span></div>`;
      } else {
        actionEl.innerHTML = `<div class="badge badge-sell"><span>賣出 -$${Math.round(Math.abs(deltaVal)).toLocaleString()}</span><span>(${deltaShares} 股)</span></div>`;
      }
    }
  });
}

function render() {
  document.getElementById('apiKey').value = state.apiKey || '';
  document.getElementById('newCash').value = state.cash || 0;
  
  const tbody = document.getElementById('assetBody');
  tbody.innerHTML = '';

  state.assets.forEach((asset, idx) => {
    const tr = document.createElement('tr');
    tr.className = 'asset-item';
    tr.innerHTML = `
      <td class="mobile-top-bar">
        <input type="text" class="ticker-input" value="${asset.ticker}" oninput="updateField(${idx}, 'ticker', this.value)" placeholder="代號">
        <button type="button" class="btn btn-del" onclick="removeAssetRow(${idx})" title="刪除">✕</button>
      </td>
      <td class="mobile-input-grid">
        <div class="field-group">
          <label>持股數 (Shares)</label>
          <input type="number" value="${asset.shares}" min="0" step="1" oninput="updateField(${idx}, 'shares', this.value)">
        </div>
        <div class="field-group">
          <label>現價 ($)</label>
          <input type="number" value="${asset.price}" min="0" step="0.01" oninput="updateField(${idx}, 'price', this.value)">
        </div>
      </td>
      <td class="mobile-input-grid">
        <div class="field-group">
          <label>目標權重 (%)</label>
          <input type="number" value="${asset.targetWeight}" min="0" max="100" step="1" oninput="updateField(${idx}, 'targetWeight', this.value)">
        </div>
        <div class="field-group">
          <label>現有市值 ($)</label>
          <div style="padding: 10px 0; font-weight: 600;" id="val-${idx}">$0.00</div>
        </div>
      </td>
      <td class="mobile-calc-summary">
        <span>目標金額</span>
        <span id="target-${idx}" style="font-weight: 600; color: var(--text);">$0.00</span>
      </td>
      <td class="mobile-action-cell" id="action-${idx}">-</td>
    `;
    tbody.appendChild(tr);
  });

  recalculateOnly();
}

// Finnhub API 即時報價
async function fetchLivePrices() {
  const key = (state.apiKey || '').trim();
  if (!key) {
    alert('請先輸入 Finnhub API Key！');
    return;
  }
  const btn = document.getElementById('btnFetch');
  btn.textContent = '更新中...';
  btn.disabled = true;

  try {
    for (let i = 0; i < state.assets.length; i++) {
      const ticker = state.assets[i].ticker.trim().toUpperCase();
      if (!ticker || ticker === 'NEW') continue;
      
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${key}`);
      const data = await res.json();
      if (data && data.c && data.c > 0) {
        state.assets[i].price = parseFloat(data.c.toFixed(2));
      }
    }
    saveState();
    render();
    alert('報價更新完成！');
  } catch (err) {
    alert('報價更新失敗，請檢查 API Key 或網路狀態。');
  } finally {
    btn.textContent = '即時更新現價';
    btn.disabled = false;
  }
}

// 備份與還原
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `portfolio_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        state = JSON.parse(ev.target.result);
        saveState();
        render();
        alert('配置還原成功！');
      } catch (err) {
        alert('JSON 檔案解析失敗。');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// 監聽頂部輸入
document.getElementById('apiKey').addEventListener('input', e => {
  state.apiKey = e.target.value.trim();
  saveState();
});
document.getElementById('newCash').addEventListener('input', e => {
  state.cash = parseFloat(e.target.value) || 0;
  saveState();
  recalculateOnly();
});

render();
</script>
</body>
</html>
